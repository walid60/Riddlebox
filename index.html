<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RiddleBox</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; background: #f9fafb; }
    header { background: #111827; color: white; padding: 1rem; text-align: center; }
    .container { padding: 2rem; max-width: 800px; margin: auto; }
    .box { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.05); margin-bottom: 2rem; }
    input, button { padding: 10px; width: 100%; margin-top: 1rem; font-size: 16px; }
    button { background: #111827; color: white; border: none; border-radius: 5px; }
    .hidden { display: none; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <header>
    <h1>RiddleBox</h1>
    <p>The Weekly Brain Challenge</p>
  </header>

  <div class="container">
    <div class="box" id="loginBox">
      <h2>Enter your nickname</h2>
      <input type="text" id="nickname" placeholder="Your nickname" />
      <button onclick="startSession()">Start</button>
    </div>

    <div class="box hidden" id="riddleBox">
      <h2>Riddle of the Week</h2>
      <p><strong>There are five pilots in five hangars of different colors...</strong><br>
      (see full clues on your office whiteboard or scan the QR code)</p>
      <p><strong>Who flies the A350?</strong></p>
      <input type="text" id="answer" placeholder="Type your answer (e.g. German)" />
      <button onclick="submitRiddle()">Submit Answer</button>
      <p id="feedback"></p>
    </div>

    <div class="box hidden" id="profileBox">
      <h2>Your Profile</h2>
      <p><strong>Name:</strong> <span id="profileName"></span></p>
      <p><strong>Score:</strong> <span id="profileScore">0</span></p>
    </div>
  </div>

  <script>
    const correctAnswer = "German";
    let user = {
      name: "",
      score: 0
    };

    function startSession() {
      const name = document.getElementById("nickname").value.trim();
      if (!name) return alert("Please enter your nickname");

      user.name = name;
      const saved = localStorage.getItem("riddlebox_" + name);
      if (saved) {
        user = JSON.parse(saved);
      } else {
        localStorage.setItem("riddlebox_" + name, JSON.stringify(user));
      }
      document.getElementById("profileName").textContent = user.name;
      document.getElementById("profileScore").textContent = user.score;
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("riddleBox").classList.remove("hidden");
      document.getElementById("profileBox").classList.remove("hidden");
    }

    function submitRiddle() {
      const answer = document.getElementById("answer").value.trim().toLowerCase();
      const feedback = document.getElementById("feedback");
      if (answer === correctAnswer.toLowerCase()) {
        if (!user.solved) {
          user.score += 1;
          user.solved = true;
          feedback.textContent = "Correct! The A350 is flown by the German pilot.";
          feedback.className = "success";
          document.getElementById("profileScore").textContent = user.score;
          localStorage.setItem("riddlebox_" + user.name, JSON.stringify(user));
        } else {
          feedback.textContent = "You already solved this riddle.";
          feedback.className = "error";
        }
      } else {
        feedback.textContent = "Incorrect. Try again.";
        feedback.className = "error";
      }
    }
  </script>
</body>
</html>
