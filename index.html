<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>RiddleBox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Fonts (Montserrat) -->
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
  <!-- Ton style général -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🧩 RiddleBox</h1>
    <p class="subtitle">Time to play</p>
  </header>
  <main class="container">
    <div class="card" id="riddleBox">
      <h2>Énigme du moment</h2>
      <div id="question" style="min-height:2em"></div>
    </div>
    <div class="card">
      <h2>Proposer une réponse</h2>
      <form id="answerForm" autocomplete="off">
        <input type="text" id="nickname" placeholder="Ton pseudo" maxlength="30" required class="flip-card__input">
        <input type="text" id="answer" placeholder="Ta réponse..." maxlength="100" required class="flip-card__input">
        <button type="submit" class="flip-card__btn">Valider</button>
      </form>
      <div id="message"></div>
    </div>
    <div class="card">
      <h2>Dernières participations</h2>
      <table>
        <thead>
          <tr>
            <th>Pseudo</th>
            <th>Réponse</th>
            <th>Statut</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="scoreTable"></tbody>
      </table>
    </div>
  </main>
  <footer>
    <p>&copy; 2025 RiddleBox – Made with ❤️ by Walid</p>
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script>
    // === CONFIG FIREBASE ===
    const firebaseConfig = {
      apiKey: "AIzaSyAeBMjUnQLuv33knZNf3-fmxxnZqJKG94E",
      authDomain: "riddlebox-2bd1a.firebaseapp.com",
      projectId: "riddlebox-2bd1a",
      storageBucket: "riddlebox-2bd1a.appspot.com",
      messagingSenderId: "441225090660",
      appId: "1:441225090660:web:f5a6b39e45615c2d6e7171"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // === Récupération de l'énigme en live ===
    let currentAnswer = "";
    function loadRiddle() {
      db.collection("settings").doc("riddle1").onSnapshot(doc => {
        if (doc.exists) {
          const data = doc.data();
          document.getElementById("question").innerHTML = data.question || "<em>En attente d'une énigme...</em>";
          currentAnswer = (data.answer || "").trim().toLowerCase();
        } else {
          document.getElementById("question").innerHTML = "<em>En attente d'une énigme...</em>";
          currentAnswer = "";
        }
      });
    }
    loadRiddle();

    // === Gérer la soumission du formulaire ===
    document.getElementById("answerForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const nickname = document.getElementById("nickname").value.trim();
      const answer = document.getElementById("answer").value.trim();
      const msg = document.getElementById("message");

      msg.textContent = "";
      if (!nickname || !answer) {
        msg.textContent = "Merci de remplir tous les champs.";
        msg.className = "error";
        return;
      }

      let isCorrect = false;
      if (currentAnswer && answer.trim().toLowerCase() === currentAnswer) {
        isCorrect = true;
      }

      // Ajoute la réponse à Firestore
      try {
        await db.collection("scores").add({
          nickname: nickname,
          answer: answer,
          correct: isCorrect,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        msg.textContent = isCorrect
          ? "Bravo, c'est la bonne réponse !"
          : "Ta réponse a été enregistrée. Essaie encore !";
        msg.className = isCorrect ? "success" : "error";
        document.getElementById("answerForm").reset();
        loadScores();
      } catch (err) {
        msg.textContent = "Erreur lors de l'envoi: " + err;
        msg.className = "error";
      }
    });

    // === Affichage des derniers scores ===
    function loadScores() {
      const table = document.getElementById("scoreTable");
      table.innerHTML = "";
      db.collection("scores").orderBy("timestamp", "desc").limit(15).get()
        .then(snapshot => {
          snapshot.forEach(doc => {
            const d = doc.data();
            let dateStr = "";
            if (d.timestamp && d.timestamp.toDate) {
              dateStr = new Date(d.timestamp.toDate()).toLocaleString();
            }
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${d.nickname}</td>
              <td>${d.answer}</td>
              <td>${d.correct ? "✔️" : "❌"}</td>
              <td>${dateStr}</td>
            `;
            table.appendChild(tr);
          });
        });
    }
    loadScores();
    // Optionnel : reload auto toutes les 30s
    setInterval(loadScores, 30000);
  </script>
</body>
</html>
