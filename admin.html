<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Administration – RiddleBox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
  <!-- Ton style général -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🔑 Admin RiddleBox</h1>
    <p class="subtitle">Gestion des énigmes et participations</p>
  </header>
  <main class="container">
    <div class="card">
      <h2>Énigme en cours</h2>
      <form id="riddleForm" autocomplete="off">
        <label for="question">Question :</label>
        <textarea id="question" class="flip-card__input" rows="3" required></textarea>
        <label for="answer">Réponse attendue :</label>
        <input type="text" id="answer" class="flip-card__input" required>
        <button type="submit" class="flip-card__btn">Enregistrer</button>
        <span id="riddleMsg"></span>
      </form>
    </div>

    <div class="card">
      <h2>Participations récentes</h2>
      <table>
        <thead>
          <tr>
            <th>Pseudo</th>
            <th>Réponse</th>
            <th>Statut</th>
            <th>Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="adminScores"></tbody>
      </table>
    </div>
  </main>
  <footer>
    <p>&copy; 2025 RiddleBox – Admin</p>
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script>
    // === CONFIG FIREBASE ===
    const firebaseConfig = {
      apiKey: "AIzaSyAeBMjUnQLuv33knZNf3-fmxxnZqJKG94E",
      authDomain: "riddlebox-2bd1a.firebaseapp.com",
      projectId: "riddlebox-2bd1a",
      storageBucket: "riddlebox-2bd1a.appspot.com",
      messagingSenderId: "441225090660",
      appId: "1:441225090660:web:f5a6b39e45615c2d6e7171"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // === Charger énigme actuelle ===
    function loadRiddle() {
      db.collection("settings").doc("riddle1").get().then(doc => {
        if (doc.exists) {
          const data = doc.data();
          document.getElementById("question").value = data.question || "";
          document.getElementById("answer").value = data.answer || "";
        }
      });
    }
    loadRiddle();

    // === Enregistrer l’énigme ===
    document.getElementById("riddleForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const question = document.getElementById("question").value.trim();
      const answer = document.getElementById("answer").value.trim();
      const msg = document.getElementById("riddleMsg");
      msg.textContent = "";

      if (!question || !answer) {
        msg.textContent = "Complétez la question ET la réponse.";
        msg.className = "error";
        return;
      }

      try {
        await db.collection("settings").doc("riddle1").set({ question, answer });
        msg.textContent = "Énigme enregistrée !";
        msg.className = "success";
      } catch(err) {
        msg.textContent = "Erreur : " + err;
        msg.className = "error";
      }
    });

    // === Afficher participations ===
    function loadScores() {
      const tbody = document.getElementById("adminScores");
      tbody.innerHTML = "";
      db.collection("scores").orderBy("timestamp", "desc").limit(25).get()
        .then(snapshot => {
          snapshot.forEach(doc => {
            const d = doc.data();
            let dateStr = "";
            if (d.timestamp && d.timestamp.toDate) {
              dateStr = new Date(d.timestamp.toDate()).toLocaleString();
            }
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${d.nickname || ""}</td>
              <td>${d.answer || ""}</td>
              <td>${d.correct ? "✔️" : "❌"}</td>
              <td>${dateStr}</td>
              <td><button class="flip-card__btn" style="padding:0.3em 1em" onclick="deleteScore('${doc.id}')">Supprimer</button></td>
            `;
            tbody.appendChild(tr);
          });
        });
    }
    loadScores();
    setInterval(loadScores, 30000);

    // === Supprimer une participation ===
    window.deleteScore = function(id) {
      if (confirm("Supprimer cette participation ?")) {
        db.collection("scores").doc(id).delete().then(loadScores);
      }
    }
  </script>
</body>
</html>
