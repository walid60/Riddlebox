<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RiddleBox Admin</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
  <!-- Ton style général -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🔑 Admin RiddleBox</h1>
    <p class="subtitle">Gestion des énigmes et des joueurs</p>
  </header>
  <main class="container">
    <div class="card" id="loginBox">
      <h2>Connexion admin</h2>
      <input type="email" id="adminEmail" placeholder="Email" autocomplete="username" class="flip-card__input" />
      <input type="password" id="adminPass" placeholder="Mot de passe" autocomplete="current-password" class="flip-card__input" />
      <button class="flip-card__btn" onclick="login()">Se connecter</button>
      <p id="loginError" class="error"></p>
    </div>
    <div class="card hidden" id="adminPanel">
      <button style="float:right;" class="flip-card__btn" onclick="logout()">Déconnexion</button>
      <div style="clear:both"></div>
      <div class="card">
        <h2>Modifier l'énigme</h2>
        <label>Question (HTML autorisé):</label>
        <textarea id="newQuestion" class="flip-card__input" rows="3" required></textarea>
        <label>Réponse attendue :</label>
        <input type="text" id="newAnswer" class="flip-card__input" required>
        <button class="flip-card__btn" onclick="updateRiddle()">Enregistrer</button>
      </div>
      <div class="card">
        <h2>Scores récents</h2>
        <button class="flip-card__btn" onclick="loadScores()">Rafraîchir</button>
        <table>
          <thead>
            <tr><th>Pseudo</th><th>Réponse</th><th>Correct</th><th>Date</th></tr>
          </thead>
          <tbody id="scoreTable"></tbody>
        </table>
      </div>
      <div class="card">
        <h2>Remise à zéro scores</h2>
        <button class="flip-card__btn danger" onclick="resetAllScores()">Supprimer tous les scores</button>
      </div>
      <div class="card">
        <h2>Gestion des joueurs</h2>
        <label>Supprimer un pseudo :</label>
        <select id="nicknameList" class="flip-card__input"></select>
        <button class="flip-card__btn danger" onclick="deleteSelectedName()">Supprimer ce joueur</button>
        <hr style="margin: 2rem 0;" />
        <label>Garder seulement ce pseudo :</label>
        <select id="keepOnlyList" class="flip-card__input"></select>
        <button class="flip-card__btn danger" onclick="deleteAllExcept()">Supprimer tous sauf ce joueur</button>
      </div>
    </div>
  </main>
  <footer>
    <p>&copy; 2025 RiddleBox – Admin</p>
  </footer>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script>
    // === CONFIG FIREBASE ===
    const firebaseConfig = {
      apiKey: "AIzaSyAeBMjUnQLuv33knZNf3-fmxxnZqJKG94E",
      authDomain: "riddlebox-2bd1a.firebaseapp.com",
      projectId: "riddlebox-2bd1a",
      storageBucket: "riddlebox-2bd1a.appspot.com",
      messagingSenderId: "441225090660",
      appId: "1:441225090660:web:f5a6b39e45615c2d6e7171"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // === REMPLACE PAR TON UID ADMIN !!! ===
    const ADMIN_UID = "[TON_UID_ADMIN]"; // Remplace par ton UID obtenu dans la console Firebase

    function login() {
      const email = document.getElementById("adminEmail").value.trim();
      const pass = document.getElementById("adminPass").value.trim();
      document.getElementById("loginError").textContent = "";
      auth.signInWithEmailAndPassword(email, pass)
        .then(userCred => {
          if (userCred.user.uid === ADMIN_UID) {
            document.getElementById("loginBox").classList.add("hidden");
            document.getElementById("adminPanel").classList.remove("hidden");
            loadNicknames();
            loadScores();
            loadRiddleForEdit();
          } else {
            logout();
            document.getElementById("loginError").textContent = "Vous n'êtes pas autorisé.";
          }
        })
        .catch(err => {
          document.getElementById("loginError").textContent = err.message;
        });
    }

    function logout() {
      auth.signOut();
      document.getElementById("adminPanel").classList.add("hidden");
      document.getElementById("loginBox").classList.remove("hidden");
      document.getElementById("adminPass").value = "";
      document.getElementById("adminEmail").value = "";
    }

    // === SECURE AUTO-REDIRECT ===
    auth.onAuthStateChanged(user => {
      if (user && user.uid === ADMIN_UID) {
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("adminPanel").classList.remove("hidden");
        loadNicknames();
        loadScores();
        loadRiddleForEdit();
      } else {
        document.getElementById("adminPanel").classList.add("hidden");
        document.getElementById("loginBox").classList.remove("hidden");
      }
    });

    function updateRiddle() {
      const question = document.getElementById("newQuestion").value.trim();
      const answer = document.getElementById("newAnswer").value.trim();
      if (!question || !answer) {
        alert("Veuillez remplir la question ET la réponse.");
        return;
      }
      db.collection("settings").doc("riddle1").set({
        question: question,
        answer: answer
      })
      .then(() => alert("Énigme enregistrée."))
      .catch(err => alert("Erreur : " + err));
    }

    function loadRiddleForEdit() {
      db.collection("settings").doc("riddle1").get()
        .then(doc => {
          if (doc.exists) {
            const data = doc.data();
            document.getElementById("newQuestion").value = data.question || "";
            document.getElementById("newAnswer").value = data.answer || "";
          }
        });
    }

    function loadScores() {
      const table = document.getElementById("scoreTable");
      table.innerHTML = "";
      db.collection("scores").orderBy("timestamp", "desc").limit(50).get()
        .then(snapshot => {
          snapshot.forEach(doc => {
            const d = doc.data();
            let dateStr = "";
            if (d.timestamp && d.timestamp.toDate) {
              dateStr = new Date(d.timestamp.toDate()).toLocaleString();
            }
            const row = document.createElement("tr");
            row.innerHTML = `
              <td>${d.nickname}</td>
              <td>${d.answer}</td>
              <td>${d.correct ? "✔️" : "❌"}</td>
              <td>${dateStr}</td>
            `;
            table.appendChild(row);
          });
        });
    }

    function resetAllScores() {
      if (!confirm("Supprimer TOUS les scores ?")) return;
      db.collection("scores").get().then(async snapshot => {
        const batches = [];
        let batch = db.batch();
        let opCount = 0;
        snapshot.forEach(doc => {
          batch.delete(doc.ref);
          opCount++;
          if (opCount === 499) {
            batches.push(batch.commit());
            batch = db.batch();
            opCount = 0;
          }
        });
        if (opCount > 0) batches.push(batch.commit());
        await Promise.all(batches);
        alert("Tous les scores sont supprimés.");
        loadScores();
        loadNicknames();
      }).catch(err => {
        alert("Erreur suppression : " + err);
        console.error(err);
      });
    }

    function loadNicknames() {
      db.collection("scores").get().then(snapshot => {
        const names = new Set();
        snapshot.forEach(doc => {
          names.add(doc.data().nickname);
        });
        const list1 = document.getElementById("nicknameList");
        const list2 = document.getElementById("keepOnlyList");
        list1.innerHTML = "";
        list2.innerHTML = "";
        names.forEach(nickname => {
          const opt1 = document.createElement("option");
          opt1.value = nickname;
          opt1.textContent = nickname;
          list1.appendChild(opt1);
          const opt2 = opt1.cloneNode(true);
          list2.appendChild(opt2);
        });
      });
    }

    function deleteSelectedName() {
      const selected = document.getElementById("nicknameList").value;
      if (!confirm(`Supprimer tous les scores pour ${selected} ?`)) return;
      db.collection("scores").where("nickname", "==", selected).get()
        .then(async snapshot => {
          if (snapshot.empty) {
            alert("Aucun score trouvé pour ce pseudo.");
            return;
          }
          const batches = [];
          let batch = db.batch();
          let opCount = 0;
          snapshot.forEach(doc => {
            batch.delete(doc.ref);
            opCount++;
            if (opCount === 499) {
              batches.push(batch.commit());
              batch = db.batch();
              opCount = 0;
            }
          });
          if (opCount > 0) batches.push(batch.commit());
          await Promise.all(batches);
          alert("Supprimé.");
          loadScores();
          loadNicknames();
        })
        .catch(err => {
          alert("Erreur suppression : " + err);
          console.error(err);
        });
    }

    function deleteAllExcept() {
      const keep = document.getElementById("keepOnlyList").value;
      if (!confirm(`Supprimer tous les scores sauf pour ${keep} ?`)) return;
      db.collection("scores").get().then(async snapshot => {
        const batches = [];
        let batch = db.batch();
        let opCount = 0;
        snapshot.forEach(doc => {
          if (doc.data().nickname !== keep) {
            batch.delete(doc.ref);
            opCount++;
            if (opCount === 499) {
              batches.push(batch.commit());
              batch = db.batch();
              opCount = 0;
            }
          }
        });
        if (opCount > 0) batches.push(batch.commit());
        await Promise.all(batches);
        alert("Suppression effectuée.");
        loadScores();
        loadNicknames();
      })
      .catch(err => {
        alert("Erreur suppression : " + err);
        console.error(err);
      });
    }
  </script>
</body>
</html>
